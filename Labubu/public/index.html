<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>LABUBU MATCHUP</title>
  
  <link rel="icon" type="image/png" href="/assets/brownanim/icono.png">

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Lemon">
</head>

<body>

  <div class="main-layout">

    <div class="info-panel left">
      <h2>CONTROLES J1</h2>
      
      <div class="section">
        <h3>TECLAS</h3>
        <ul>
          <li>W - Arriba</li>
          <li>S - Abajo</li>
          <li>A - Izquierda</li>
          <li>D - Derecha</li>
          <li>SHIFT - Disparo</li>
        </ul>
      </div>
    </div>

    <div id="game-container"></div>

    <div class="info-panel right">

      <div class="section">
        <h2>CONTROLES J2</h2>
      
      <div class="section">
        <h3>FLECHAS</h3>
        <ul>
          <li>↑ - Arriba</li>
          <li>↓ - Abajo</li>
          <li>← - Izquierda</li>
          <li>→ - Derecha</li>
          <li>ENTER - Disparo</li>
        </ul>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.70.0/phaser.min.js"></script>
  <script src="bundle.js"></script>

</body>
</html>
